<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Dashboard</title>
  <!-- Single CSS file -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="light-mode">

  <!-- ── HEADER: Greeting, Clock, Name Input, Theme Toggle ─────────────────── -->
  <header id="header">
    <div id="greeting-section">
      <!-- Greeting text: e.g. "Good Morning, Feri!" — updated by JS every second -->
      <h1 id="greeting-text">Good Morning, Friend!</h1>
      <!-- Live clock — updated by updateClock() every second -->
      <p id="current-time">00:00:00</p>
      <!-- Current date — e.g. "Friday, 5 October 2026" -->
      <p id="current-date">Loading date…</p>
    </div>

    <div id="header-controls">
      <!-- Name input: pre-filled from LocalStorage by initGreeting() -->
      <div id="name-control">
        <label for="username-input" class="sr-only">Your name</label>
        <input
          id="username-input"
          type="text"
          placeholder="Enter your name…"
          maxlength="40"
          autocomplete="off"
          aria-label="Your name"
        />
        <button id="save-name-btn" aria-label="Save name">Save</button>
      </div>
      <!-- Theme toggle button — icon swapped by applyTheme() -->
      <button id="theme-toggle-btn" aria-label="Toggle dark/light mode" title="Toggle dark/light mode">
        🌙
      </button>
    </div>
  </header>

  <!-- ── MAIN DASHBOARD GRID ────────────────────────────────────────────────── -->
  <main id="dashboard">

    <!-- ── SECTION 1: Focus Timer ─────────────────────────────────────────── -->
    <section id="timer-section" aria-label="Focus Timer">
      <h2>⏱ Focus Timer</h2>

      <!-- MM:SS display — written by renderTimerDisplay() -->
      <div id="timer-display" role="timer" aria-live="off">25:00</div>

      <!-- Start / Stop / Reset controls -->
      <div id="timer-controls">
        <button id="timer-start-btn" aria-label="Start timer">Start</button>
        <button id="timer-stop-btn"  aria-label="Stop timer">Stop</button>
        <button id="timer-reset-btn" aria-label="Reset timer">Reset</button>
      </div>

      <!-- Custom duration setting -->
      <div id="timer-settings">
        <label for="timer-duration-input">Duration (min):</label>
        <input
          id="timer-duration-input"
          type="number"
          min="1"
          max="120"
          value="25"
          aria-label="Timer duration in minutes"
        />
        <button id="timer-set-btn" aria-label="Set timer duration">Set</button>
      </div>
    </section>

    <!-- ── SECTION 2: To-Do List ───────────────────────────────────────────── -->
    <section id="todo-section" aria-label="To-Do List">
      <h2>✅ To-Do List</h2>

      <!-- Add task input row -->
      <div id="todo-controls">
        <label for="todo-input" class="sr-only">New task</label>
        <input
          id="todo-input"
          type="text"
          placeholder="Add a new task…"
          maxlength="200"
          autocomplete="off"
          aria-label="New task text"
        />
        <button id="todo-add-btn" aria-label="Add task">Add</button>
      </div>

      <!-- Sort + filter selectors -->
      <div id="todo-filters">
        <label for="todo-sort-select" class="sr-only">Sort tasks</label>
        <select id="todo-sort-select" aria-label="Sort tasks">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="active">Active First</option>
          <option value="done">Done First</option>
        </select>

        <label for="todo-filter-select" class="sr-only">Filter tasks</label>
        <select id="todo-filter-select" aria-label="Filter tasks">
          <option value="all">All Tasks</option>
          <option value="active">Active</option>
          <option value="done">Done</option>
        </select>
      </div>

      <!-- Task count — updated by updateTaskCount() -->
      <p id="todo-count" aria-live="polite">0 tasks remaining</p>

      <!-- Task list — <li> elements injected by renderTasks() -->
      <ul id="todo-list" aria-label="Task list"></ul>
    </section>

    <!-- ── SECTION 3: Quick Links ──────────────────────────────────────────── -->
    <section id="links-section" aria-label="Quick Links">
      <h2>🔗 Quick Links</h2>

      <!-- Add link form row -->
      <div id="links-controls">
        <label for="link-name-input" class="sr-only">Link label</label>
        <input
          id="link-name-input"
          type="text"
          placeholder="Label (e.g. GitHub)"
          maxlength="50"
          autocomplete="off"
          aria-label="Link label"
        />
        <label for="link-url-input" class="sr-only">Link URL</label>
        <input
          id="link-url-input"
          type="url"
          placeholder="https://…"
          maxlength="500"
          autocomplete="off"
          aria-label="Link URL"
        />
        <button id="link-add-btn" aria-label="Add quick link">Add</button>
      </div>

      <!-- Link buttons injected by renderLinks() -->
      <div id="links-grid" role="list" aria-label="Quick links grid"></div>
    </section>

  </main>

  <!-- Single JS file — loaded with defer so DOM is ready -->
  <script src="js/app.js" defer></script>
</body>
</html>
