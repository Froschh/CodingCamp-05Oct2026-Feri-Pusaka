<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Dashboard</title>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="light">

  <!-- ===================== HEADER / THEME TOGGLE ===================== -->
  <header class="app-header">
    <div class="header-inner">
      <span class="app-title">📋 Dashboard</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode" title="Toggle theme">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <!-- ===================== MAIN CONTENT ===================== -->
  <main class="app-main">

    <!-- ---- GREETING SECTION ---- -->
    <section class="card greeting-card" aria-label="Greeting">
      <div class="greeting-time-block">
        <div class="clock" id="clock" aria-live="polite">00:00:00</div>
        <div class="date" id="dateDisplay"></div>
      </div>
      <div class="greeting-text-block">
        <h1 class="greeting-message" id="greetingMessage">Good Morning,</h1>
        <div class="greeting-name-wrapper">
          <!-- Name display -->
          <span class="greeting-name" id="greetingName" title="Click to edit your name" role="button" tabindex="0" aria-label="Your name — click to edit"></span>
          <!-- Inline name edit input (hidden by default) -->
          <div class="name-edit-wrapper hidden" id="nameEditWrapper">
            <input type="text" class="name-input" id="nameInput" maxlength="40" placeholder="Enter your name" aria-label="Edit your name" />
            <button class="btn btn-accent btn-sm" id="saveNameBtn">Save</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ---- DASHBOARD GRID ---- -->
    <div class="dashboard-grid">

      <!-- ---- FOCUS TIMER ---- -->
      <section class="card timer-card" aria-label="Focus Timer">
        <h2 class="card-title">⏱ Focus Timer</h2>

        <div class="timer-display" id="timerDisplay" aria-live="polite" aria-atomic="true">25:00</div>

        <div class="timer-controls">
          <button class="btn btn-accent" id="timerStartBtn" aria-label="Start timer">Start</button>
          <button class="btn btn-secondary" id="timerStopBtn" aria-label="Pause timer">Pause</button>
          <button class="btn btn-ghost" id="timerResetBtn" aria-label="Reset timer">Reset</button>
        </div>

        <div class="timer-settings">
          <label for="pomodoroMinutes" class="timer-label">Set minutes:</label>
          <input
            type="number"
            id="pomodoroMinutes"
            class="timer-input"
            min="1"
            max="120"
            value="25"
            aria-label="Pomodoro duration in minutes"
          />
          <button class="btn btn-ghost btn-sm" id="applyTimerBtn">Apply</button>
        </div>
      </section>

      <!-- ---- TO-DO LIST ---- -->
      <section class="card todo-card" aria-label="To-Do List">
        <h2 class="card-title">✅ To-Do List</h2>

        <!-- Add task -->
        <div class="todo-add-row">
          <input
            type="text"
            id="taskInput"
            class="text-input"
            placeholder="Add a new task…"
            maxlength="200"
            aria-label="New task text"
          />
          <button class="btn btn-accent" id="addTaskBtn" aria-label="Add task">Add</button>
        </div>
        <p class="error-msg hidden" id="taskError" role="alert" aria-live="assertive"></p>

        <!-- Sort controls -->
        <div class="todo-sort-row">
          <span class="sort-label">Sort:</span>
          <button class="sort-btn active" data-sort="default" aria-pressed="true">Default</button>
          <button class="sort-btn" data-sort="alpha" aria-pressed="false">A–Z</button>
          <button class="sort-btn" data-sort="completed" aria-pressed="false">Completed Last</button>
        </div>

        <!-- Task list -->
        <ul class="task-list" id="taskList" aria-label="Tasks" aria-live="polite"></ul>
      </section>

    </div><!-- /dashboard-grid -->

    <!-- ---- QUICK LINKS ---- -->
    <section class="card links-card" aria-label="Quick Links">
      <div class="links-header">
        <h2 class="card-title">🔗 Quick Links</h2>
        <button class="btn btn-accent btn-sm" id="openAddLinkBtn" aria-label="Add a new quick link">+ Add Link</button>
      </div>
      <div class="links-grid" id="linksGrid" aria-live="polite"></div>
    </section>

  </main>

  <!-- ===================== ADD-LINK MODAL ===================== -->
  <div class="modal-overlay hidden" id="linkModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h3 class="modal-title" id="modalTitle">Add Quick Link</h3>
      <div class="modal-body">
        <label for="linkNameInput" class="form-label">Name</label>
        <input type="text" id="linkNameInput" class="text-input" placeholder="e.g. GitHub" maxlength="50" />

        <label for="linkUrlInput" class="form-label">URL</label>
        <input type="url" id="linkUrlInput" class="text-input" placeholder="https://example.com" />

        <p class="error-msg hidden" id="linkError" role="alert" aria-live="assertive"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="cancelLinkBtn">Cancel</button>
        <button class="btn btn-accent" id="saveLinkBtn">Save Link</button>
      </div>
    </div>
  </div>

  <!-- ===================== FOOTER ===================== -->
  <footer class="app-footer">
    <p>To-Do List Dashboard &mdash; all data stored locally in your browser.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
